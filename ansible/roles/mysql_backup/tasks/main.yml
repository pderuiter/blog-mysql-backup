---
# The post's first play: runs on the MySQL server.
- name: Install rsync (synchronize needs it on both ends)
  ansible.builtin.apt:
    name: rsync
    state: present

- name: Create the SSH key used to reach the backup server
  community.crypto.openssh_keypair:
    path: "{{ ssh_key }}"
    type: ed25519
    comment: "mysql-backup@{{ inventory_hostname }}"
  become: false
  register: mysql_backup_keypair

- name: Publish the public key for the backup server play
  ansible.builtin.set_fact:
    mysql_backup_public_key: "{{ mysql_backup_keypair.public_key }}"

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ mysql_backup_dir }}"
    state: directory
    mode: "0755"

# Same pipeline as the post. --skip-dump-date and gzip -n make the output
# reproducible; the new dump only replaces the old one when it differs, so an
# unchanged database is reported as "ok" and rsync has nothing to copy.
- name: Dump MySQL database
  ansible.builtin.shell: >-
    set -o pipefail &&
    mysqldump -u{{ mysql_user }} -p{{ mysql_password | quote }} --skip-dump-date {{ mysql_database }}
    | gzip -n > {{ mysql_backup_tmp_file }} &&
    if cmp -s {{ mysql_backup_tmp_file }} {{ mysql_backup_dir }}/{{ mysql_database }}.sql.gz;
    then rm -f {{ mysql_backup_tmp_file }};
    else mv {{ mysql_backup_tmp_file }} {{ mysql_backup_dir }}/{{ mysql_database }}.sql.gz && echo BACKUP_UPDATED;
    fi
  args:
    executable: /bin/bash
  register: mysql_backup_dump
  changed_when: "'BACKUP_UPDATED' in mysql_backup_dump.stdout"
  no_log: true
